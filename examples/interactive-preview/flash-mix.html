<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firmware flash mix — interactive</title>
<style>
  :root {
    --fg: var(--foreground, #1a1a1a);
    --muted: var(--muted-foreground, #6b6b6b);
    --accent: var(--accent, #2f6feb);
    --border: var(--border, #d9d9d9);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
  }
  .wrap { padding: 6px 4px 10px; display: flex; flex-direction: column; gap: 14px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .total { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .row { display: grid; grid-template-columns: 5.5rem 1fr 5.5rem 1.4rem; align-items: center; gap: 8px; }
  .name { font-size: 13px; }
  .track { position: relative; height: 18px; border-radius: 3px; background: color-mix(in srgb, var(--fg) 8%, transparent); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); transition: width 140ms ease; }
  .val { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .delta { color: var(--accent); font-weight: 600; }
  .ctl {
    width: 1.4rem; height: 1.4rem; padding: 0; border: 1px solid var(--border);
    border-radius: 4px; background: transparent; color: var(--fg); font-size: 13px;
    line-height: 1; cursor: pointer;
  }
  .ctl:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  button.pick {
    align-self: flex-start; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--fg); font: inherit; cursor: pointer;
  }
  button.pick:hover:enabled { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  button.pick:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="head">
      <h2>Firmware flash mix, per run</h2>
      <span class="total">total <b id="total">0</b> runs</span>
    </div>
    <div class="rows" id="rows"></div>
  </div>
  <button class="pick" id="send" type="button" disabled>Report the mix to the agent</button>
</div>

<script>
(function () {
  // The values the answer already stated. The widget invents nothing: it holds
  // them, re-derives from them, and reports back only what CHANGED.
  var START = { 'C8051F121': 42, '291e panel': 18, '223e surface': 7 };
  var state = {};
  for (var k in START) state[k] = START[k];

  var NAMES = { 'C8051F121': 'C8051F121', '291e panel': '291e panel', '223e surface': '223e surface' };
  var rows = document.getElementById('rows');
  var totalEl = document.getElementById('total');
  var sendBtn = document.getElementById('send');

  var dirty = {};
  var inflight = false;

  function render() {
    rows.textContent = '';
    var keys = Object.keys(state);
    var max = 0, sum = 0, i, key;
    for (i = 0; i < keys.length; i++) { if (state[keys[i]] > max) max = state[keys[i]]; sum += state[keys[i]]; }
    max = max || 1;

    for (i = 0; i < keys.length; i++) {
      key = keys[i];
      var row = document.createElement('div');
      row.className = 'row';

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = NAMES[key] || key;

      var track = document.createElement('div');
      track.className = 'track';
      var fill = document.createElement('div');
      fill.className = 'fill';
      // Scaled against the leading run, so the largest always fills the track.
      fill.style.width = (100 * state[key] / max).toFixed(1) + '%';
      track.appendChild(fill);

      var val = document.createElement('span');
      val.className = 'val';
      val.textContent = state[key];
      if (dirty[key]) {
        var d = document.createElement('span');
        d.className = 'delta';
        d.textContent = ' +' + dirty[key];
        val.appendChild(d);
      }

      var ctl = document.createElement('button');
      ctl.className = 'ctl';
      ctl.type = 'button';
      ctl.title = 'Log one more run for ' + (NAMES[key] || key);
      ctl.setAttribute('aria-label', 'Log one more run for ' + (NAMES[key] || key));
      ctl.textContent = '+';
      ctl.onclick = (function (which) {
        return function () { state[which]++; dirty[which] = (dirty[which] || 0) + 1; render(); };
      })(key);

      row.appendChild(name); row.appendChild(track); row.appendChild(val); row.appendChild(ctl);
      rows.appendChild(row);
    }
    totalEl.textContent = sum;

    var any = Object.keys(dirty).length > 0;
    sendBtn.disabled = !any || inflight;
    sendBtn.textContent = inflight ? 'Sending…' : 'Report the mix to the agent';
  }

  // The one voice a widget has. `window.hermes.send` types the turn hidden, so
  // no user bubble renders — the widget's own update IS the visible response.
  // The app rejects a prompt over 500 chars and one that arrives under 1/s, so
  // this fires once per click, carries the DELTA rather than the whole mix,
  // and reads the ack rather than assuming delivery.
  sendBtn.onclick = function () {
    if (inflight || !window.hermes || typeof window.hermes.send !== 'function') return;
    inflight = true;
    var parts = [];
    for (var key in dirty) parts.push((NAMES[key] || key) + ' +' + dirty[key]);
    var prompt = 'Logged ' + parts.join(', ') + ' flash runs since the last chart. Update the mix.';

    window.hermes.send(prompt)
      .then(function (ack) {
        inflight = false;
        sendBtn.textContent = ack && ack.ok ? 'Sent' : (ack && ack.error === 'throttled' ? 'Too fast — try again' : 'Not sent');
        setTimeout(function () { dirty = {}; render(); }, 1400);
      })
      .catch(function () { inflight = false; render(); });
  };

  render();
})();
</script>
</body>
</html>
