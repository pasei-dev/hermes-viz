# Derivation as data. Each rule: a matcher, the kind it produces, and how many rows it needs.
#
# The matcher lives in python/derive.py; this file only says what may fire and what it becomes. Adding a
# pattern is a row here, never a code branch. `group` is what the settings pane toggles.
#
# Matchers available:
#   number-run     — consecutive `Label: 12` / `Label — 12` / `- Label: 12` lines
#   table          — a markdown pipe table whose body is mostly numeric
#   steps-list     — an ordered list of short items
#   section-bold    — an all-bold line (`**Heading**`) that is not yet a heading
#   section-heading — a short heading-like line directly above a list or a table
#   section-markdown — a `#`/`##`/`###` heading the answer already carries (never one we insert)
#   checklist      — a task-list run (`- [x] done`, `- [ ] todo`, `- [/] doing`, `- [!] blocked`)
#   changes        — a `path +12 -3` run, one line per file
#   outline        — a dotted-number run (`1. Title`, `1.1 Sub`), at least one dotted
#   facts          — a `Label: value` run whose values are text, not numbers
#   files          — a `path: meta` run whose labels look like file paths
#   parts          — a markdown table with a ref/part column and a qty column (a BOM)
#   settings       — a `Label: on|off` run (enabled/disabled/true/false/yes/no normalised)
#   timeline       — a `when — label[ — detail]` run, `when` a date or clock time
#   ranges         — a `Label: lo..hi` run
#   metrics        — a `Label: value (delta)` run
#   array          — a run of `a | b | c` rows that is not a markdown table
#   heatmap        — a long numeric run (>= 6 rows), the same shape as `bars`
#   wireframe      — a `Label: block:count, block:count` run (a UI mock)
#   candlestick    — a `when: open:high:low:close` run (OHLC candles)
#   flow-arrows    — an `A -> B -> C` arrow chain (a Mermaid flowchart)
#   state-transitions — a run of `A -> B` single transitions (a Mermaid state diagram)
#   sequence-messages — a run of `A -> B: message` lines (a Mermaid sequence diagram)
#   gantt-schedule — a run of `Label: <date> .. <date>` spans (a Mermaid gantt)
#   pie-shares     — a run of `Label: 42%` shares adding up to 100 (a Mermaid pie)
#   dated-events   — a `when — label[ — detail]` run, read as a Mermaid timeline fence
#   bracket        — a `round: winner>loser, winner>loser` run (a knockout bracket)
#   gloss          — a `source=gloss[=note]` line, word-aligned (an interlinear gloss)
#   forms          — a markdown table whose header is grammatical categories (a paradigm grid)
rules:
  - id: number-run-bars
    when: number-run
    kind: bars
    min: 3
    group: numbers
  - id: number-run-kpi
    when: number-run
    kind: kpi
    min: 2
    max: 2
    group: numbers
  - id: numeric-table-bars
    when: table
    kind: bars
    min: 3
    group: tables
  - id: steps-flow
    when: steps-list
    kind: steps
    min: 3
    max: 8
    group: steps

  # Round 2 — the structure layer. A `section` rule inserts a `### ` marker in front of an anchor the
  # answer already treats as a heading, and emits the `section` widget; it never removes or reorders a
  # line. `group: structure` is what the settings pane toggles the whole layer with.
  - id: section-bold
    when: section-bold
    kind: section
    min: 1
    group: structure
  - id: section-heading
    when: section-heading
    kind: section
    min: 1
    group: structure
  - id: section-markdown
    when: section-markdown
    kind: section
    min: 1
    group: structure

  # Round 2 — the twelve answer-shaped widgets. Groups are named after the kind, so one switch each.
  - id: checklist-states
    when: checklist
    kind: checklist
    min: 2
    group: checklist
  - id: changes-summary
    when: changes
    kind: changes
    min: 2
    group: changes
  - id: outline-tree
    when: outline
    kind: outline
    min: 3
    group: outline
  - id: facts-card
    when: facts
    kind: facts
    min: 3
    group: facts
  - id: files-list
    when: files
    kind: files
    min: 2
    group: files
  - id: parts-bom
    when: parts
    kind: parts
    min: 2
    group: parts
  - id: settings-flags
    when: settings
    kind: settings
    min: 2
    group: settings
  - id: timeline-events
    when: timeline
    kind: timeline
    min: 2
    group: timeline
  - id: ranges-spans
    when: ranges
    kind: ranges
    min: 3
    group: ranges
  - id: metrics-deltas
    when: metrics
    kind: metrics
    min: 2
    group: metrics
  - id: array-grid
    when: array
    kind: array
    min: 2
    group: array
  - id: heatmap-ramp
    when: heatmap
    kind: heatmap
    min: 6
    group: heatmap

  # Round 3 — the two new answer-shaped kinds. `wireframe` is a block run (`Toolbar: btn:3,field:1`);
  # `candlestick` is a `when: open:high:low:close` run. Both keep `,` and `:` inside the value — only
  # `;` `|` `=` `~` `\` are stripped — so they never need the pipe separator.
  - id: wireframe-blocks
    when: wireframe
    kind: wireframe
    min: 2
    group: wireframe
  - id: candlestick-ohlc
    when: candlestick
    kind: candlestick
    min: 2
    group: candlestick

  # Round 3 — the Mermaid path. An arrow chain (`A -> B -> C`) genuinely wants a diagram: the spec
  # carries a `body`, which is what routes it to a mermaid fence rather than a board entry.
  - id: flow-arrows
    when: flow-arrows
    kind: flowchart
    min: 1
    group: flow

  # Round 5 — the rest of the Mermaid kinds. Each body is the shape the text itself states: a run of
  # named states with transitions, an exchange of messages, a schedule with dates, shares of one whole,
  # dated events. A kind whose body would have to be invented has no rule here and is never emitted.
  # `group: mermaid` is the one switch for the family.
  - id: state-transitions
    when: state-transitions
    kind: state
    min: 2
    group: mermaid
  - id: sequence-messages
    when: sequence-messages
    kind: sequence
    min: 2
    group: mermaid
  - id: gantt-schedule
    when: gantt-schedule
    kind: gantt
    min: 2
    group: mermaid
  - id: pie-shares
    when: pie-shares
    kind: pie
    min: 2
    group: mermaid
  # The dated-event run already has a widget rule (`timeline-events`, group `timeline`); this reads the
  # same rows as a fence. The widget's rule comes first, so with both groups on a dataset is emitted once.
  - id: dated-events
    when: dated-events
    kind: timeline
    min: 2
    group: mermaid

  # Round 6 — the last three of the catalogue. A bracket is rounds of pairings (so two rounds, never a
  # single pairing); a gloss is one word-aligned source/gloss line; a forms grid is a labelled paradigm.
  # Each group is its own switch, and each matcher fires only on the shape the text actually states.
  - id: bracket-rounds
    when: bracket
    kind: bracket
    min: 2
    group: bracket
  - id: gloss-lines
    when: gloss
    kind: gloss
    min: 1
    group: gloss
  - id: forms-paradigm
    when: forms
    kind: forms
    min: 2
    group: forms
